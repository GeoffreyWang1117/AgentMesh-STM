[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmesh-stm"
version = "0.1.0"
description = "Software Transactional Memory based Multi-Agent Coordination Framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["llm", "agents", "stm", "concurrency", "multi-agent", "coordination"]

dependencies = [
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-java>=0.21.0",
    "libcst>=1.1.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "aiosqlite>=0.19.0",
    "lmdb>=1.4.0",
    "datasets>=2.14.0",
    "pydantic>=2.0.0",
    "structlog>=23.1.0",
    "tenacity>=8.2.0",
    "gitpython>=3.1.0",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "black>=23.9.0",
]
transformers = [
    "transformers>=4.35.0",
    "torch>=2.0.0",
]

[project.scripts]
agentmesh-stm = "agentmesh_stm.cli.main:main"

[project.urls]
"Homepage" = "https://github.com/GeoffreyWang1117/AgentMesh-STM"
"Bug Tracker" = "https://github.com/GeoffreyWang1117/AgentMesh-STM/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.black]
line-length = 100
target-version = ["py310"]
